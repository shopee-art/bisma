{{ define "attendance_history" }}
<div class="max-w-3xl mx-auto w-full bg-white p-5 rounded-lg shadow-sm border border-gray-200" x-data="{ modalOpen: false, currentImg: '' }">
    <h3 class="text-md font-bold text-gray-700 mb-4">Log Kehadiran Mandiri</h3>
    <div class="overflow-x-auto">
        <table class="min-w-full divide-y divide-gray-200 text-sm text-left">
            <thead class="bg-gray-50">
                <tr>
                    <th class="px-3 py-2 font-semibold text-gray-600">No</th>
                    <th class="px-3 py-2 font-semibold text-gray-600">Tanggal</th>
                    <th class="px-3 py-2 font-semibold text-gray-600">Jam</th>
                    <th class="px-3 py-2 font-semibold text-gray-600">Kamera</th>
                    <th class="px-3 py-2 font-semibold text-gray-600 text-center">Status</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-200">
                {{ range $index, $log := .history }}
                <tr>
                    <td class="px-3 py-3">{{ md_add $index 1 }}</td>
                    <td class="px-3 py-3 font-medium text-gray-900">{{ $log.Date }}</td>
                    <td class="px-3 py-3 text-gray-500 text-xs">{{ $log.Time }} WIB</td>
                    <td class="px-3 py-3">
                        <button @click="currentImg = '{{ $log.Photo }}'; modalOpen = true" class="text-[11px] bg-gray-100 border px-2 py-0.5 rounded hover:bg-gray-200 transition">Lihat Foto</button>
                    </td>
                    <td class="px-3 py-3 text-center">
                        <span class="px-2 py-0.5 text-xs font-bold rounded-full bg-green-100 text-green-800">{{ $log.Status }}</span>
                    </td>
                </tr>
                {{ else }}
                <tr><td colspan="5" class="px-3 py-6 text-center text-gray-400 italic">Belum ada riwayat kehadiran tercatat.</td></tr>
                {{ end }}
            </tbody>
        </table>
    </div>

    <div x-show="modalOpen" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60" x-cloak>
        <div class="bg-white rounded p-4 w-full max-w-xs shadow-xl" @click.away="modalOpen = false">
            <div class="flex justify-between text-xs font-bold mb-2 text-gray-700"><span>Bukti Selfie</span><button @click="modalOpen = false" class="text-sm">&times;</button></div>
            <div class="aspect-video rounded overflow-hidden bg-gray-100"><img :src="currentImg" class="w-full h-full object-cover" alt="Selfie Absensi"></div>
        </div>
    </div>
</div>
{{ end }}
