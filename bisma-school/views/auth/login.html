<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BiSMA School</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded-lg shadow-md w-96">
        <h2 class="text-2xl font-bold mb-6 text-center text-blue-600">BiSMA School</h2>
        <p class="text-sm text-gray-500 text-center mb-6">Sistem Informasi Sekolah</p>
        
        <form action="/login" method="POST">
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700">Masuk Sebagai</label>
                <select name="role_type" class="mt-1 block w-full rounded-md border-gray-300 shadow-xs focus:border-blue-500 focus:ring-blue-500 p-2 border">
                    <option value="guru">Guru / Admin</option>
                    <option value="siswa">Siswa</option>
                </select>
            </div>

            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700">Nomor Induk (NIP / NIS)</label>
                <input type="text" name="identity_number" required class="mt-1 block w-full rounded-md border-gray-300 shadow-xs focus:border-blue-500 focus:ring-blue-500 p-2 border" placeholder="Masukkan NIP atau NIS">
            </div>

            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700">Password</label>
                <input type="password" name="password" required class="mt-1 block w-full rounded-md border-gray-300 shadow-xs focus:border-blue-500 focus:ring-blue-500 p-2 border" placeholder="******">
            </div>

            <button type="submit" class="w-full bg-blue-600 text-white p-2 rounded-md hover:bg-blue-700 transition duration-200">
                Masuk
            </button>
        </form>
    </div>
</body>
</html>
